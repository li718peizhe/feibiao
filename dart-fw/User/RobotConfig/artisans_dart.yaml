modules:
  - module: xrobot-org/BlinkLED
    id: blink_led
    args:
      - led: LED_B
      - blink_cycle: 250
  - module: xrobot-org/BuzzerAlarm
    id: buzzer_alarm
    args:
      - pwm: pwm_tim4_ch3
      - alarm_freq: 1500
      - alarm_duration: 300
      - alarm_delay: 300
  - module: QDU-Robomaster/RMMotor
    id: slider_left
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 514
  - module: QDU-Robomaster/RMMotor
    id: slider_right
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: true
          feedback_id: 513
  - module: QDU-Robomaster/RMMotor
    id: pitch_motor
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 515
  - module: QDU-Robomaster/RMMotor
    id: yaw_motor
    args:
      - can_bus: can2
      - param:
          model: RMMotor::Model::MOTOR_M2006
          reverse: false
          feedback_id: 514
  - module: QDU-Robomaster/RMMotor
    id: arm_motor
    args:
      - can_bus: can2
      - param:
          model: RMMotor::Model::MOTOR_GM6020
          reverse: false
          feedback_id: 517
  - module: QDU-Robomaster/Referee
    id: referee
    args:
      - uart: usart6
      - cmd: nullptr
      - param:
          task_stack_depth_uart: 756
          baudrate: 115200
          referee_chassis_tp_name: "chassis_ref"
          referee_launcher_tp_name: "launcher_ref"
          referee_robot_game_tp_name: "robot_game_ref"
          referee_radar_tp_name: "radar_ref"
          thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - module: local/DartLauncher
    id: dart_launcher
    args:
      - slider_left: slider_left
      - slider_right: slider_right
      - pitch: pitch_motor
      - yaw: yaw_motor
      - arm: arm_motor
      - slider_can: can1
      - pitch_can: can1
      - yaw_can: can2
      - arm_can: can2
      - slider_left_id: 514
      - slider_right_id: 513
      - pitch_id: 515
      - yaw_id: 514
      - arm_id: 517
      - referee: referee
      - dbus: usart3
      - lock_pwm: pwm_tim8_ch2
      - crank_pwm: pwm_tim8_ch3
      - magnet_pwm: pwm_tim1_ch3
      - tension_uart: usart1
settings:
  monitor_sleep_ms: 1000
